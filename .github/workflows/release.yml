name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for, e.g. v3.10.0-2609"
        required: true
        type: string

concurrency:
  # Never cancel a half-finished publish.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: The tag must name the Rodin version actually being built
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The trailing .N is how a second release in one month is named:
          # YYMM alone has no room for it.  BASH_REMATCH[1] is still the
          # version, and the prerelease test below matches on -rc directly.
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]{4}(\.[0-9]+)?(-rc[0-9]+)?$ ]]; then
            echo "Tag '$TAG' does not match vX.Y.Z-YYMM[.N] (optionally -rcN)." >&2
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"
          # Read the module's own <version>, falling back to the parent's the
          # way Maven does.  Taking the first -SNAPSHOT in the file instead
          # picks up the <parent> block, so it checks the wrong number as soon
          # as the two diverge -- and finds nothing at all once the bundle
          # version stops being a snapshot.
          pom_version=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse('bundle/pom.xml').getroot()
          v = root.find('m:version', ns)
          if v is None:
              v = root.find('m:parent/m:version', ns)
          print(v.text.strip().removesuffix('-SNAPSHOT'))
          PY
          )
          echo "tag says $tag_version, bundle/pom.xml says $pom_version"
          if [ "$tag_version" != "$pom_version" ]; then
            echo "Tag claims Rodin $tag_version but the bundle builds $pom_version." >&2
            exit 1
          fi

      - name: The submodule pins must be current
        # A release is built from the recorded pins so the tag is reproducible.
        # That is only safe if the pins are what we think they are, so refuse to
        # publish a release that would silently ship stale submodule commits.
        run: |
          set -euo pipefail
          stale=0
          while read -r sha path _; do
            branch=$(git config -f .gitmodules "submodule.${path}.branch")
            tip=$(git ls-remote "$(git config -f .gitmodules "submodule.${path}.url")" \
                    "refs/heads/${branch}" | cut -f1)
            if [ "$sha" != "$tip" ]; then
              echo "::error::$path is pinned at ${sha:0:12} but ${branch} is at ${tip:0:12}"
              stale=1
            else
              echo "$path pinned at ${sha:0:12} (= ${branch} tip)"
            fi
          done < <(git submodule status --cached | sed 's/^[+-]//')
          if [ "$stale" -ne 0 ]; then
            echo "Update the submodule pins on main and re-tag." >&2
            exit 1
          fi

  build:
    needs: guard
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      pin-submodules: true

  sign:
    needs: build
    # Before smoke, so the archives the smoke test exercises are byte for byte
    # the ones the release serves.  Signing afterwards would leave the tested
    # artifact and the published artifact different files.
    uses: ./.github/workflows/sign-macos.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  smoke:
    needs: sign
    uses: ./.github/workflows/smoke.yml
    with:
      assets-artifact: assets-signed
      # False when the signing secrets are missing: the archives then carry an
      # ad-hoc signature, and asserting Gatekeeper on those would fail a
      # release that never claimed to be notarized.
      signed: ${{ needs.sign.outputs.signed == 'true' }}

  publish:
    name: Publish release
    # `sign` as well as `smoke`, because the notes below have to say what the
    # macOS archives actually are: a run without the signing secrets ships an
    # ad-hoc signature and must not claim a notarized one.
    needs: [sign, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestations
      attestations: write # record them against this repository
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: assets-signed
          path: assets

      - name: Write the release notes header
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          set -euo pipefail
          # The built update site names every feature <id>_<version>.jar, so the
          # versions in the notes are the ones actually shipped, not a guess.
          mkdir -p site && unzip -qo assets/rodin-bundle-update-site.zip -d site
          version_of() {
            find site/features -name "$1_*.jar" -printf '%f\n' \
              | sed -E "s/^$1_(.*)\.jar$/\1/" | sort -V | tail -1
          }
          {
            echo "Rodin platform bundle for Event-B, built from Rodin 3.10."
            echo
            echo "| Feature | Version |"
            echo "| --- | --- |"
            echo "| Rodin platform | \`$(version_of org.rodinp.platform)\` |"
            echo "| Event-B IDE | \`$(version_of org.eventb.ide)\` |"
            echo "| SMT provers | \`$(version_of org.eventb.smt)\` |"
            echo "| ProB | \`$(version_of de.prob2.feature)\` |"
            echo "| Proof Obligation Cleaner | \`$(version_of ru.ispras.eventb.pocleaner.feature)\` |"
            echo "| Rossi bridge | \`$(version_of org.eventb.rossi.bridge.feature)\` |"
            echo
            echo "### Before you install"
            echo
            echo "- Requires a 64-bit Java 21 runtime or later."
            echo "- **Both proving modes default to the SMT profiles**: \`Default"
            echo "  Interactive Tactic with SMT\` for interactive proving and \`Default"
            echo "  Auto Tactic with SMT\` for background proving. An existing workspace"
            echo "  keeps its own choices; use *Restore Defaults* under Event-B →"
            echo "  Sequent Prover → Auto/Post Tactic to adopt these."
            echo "- **The bundled SMT solvers now work on Apple Silicon.** Z3 and veriT"
            echo "  are native arm64 builds; CVC3 and CVC4 are x86_64 and run under"
            echo "  Rosetta 2, so install it if you want those two"
            echo "  (\`softwareupdate --install-rosetta\`). The native"
            echo "  \`macosx.cocoa.aarch64\` build no longer needs an Intel JVM to prove."
            if [ "$SIGNED" = true ]; then
              echo "- The macOS archives are signed with a Developer ID certificate,"
              echo "  notarized by Apple and stapled: the first launch shows only macOS's"
              echo "  usual question about an app downloaded from the Internet, and no"
              echo "  \`xattr\` incantation is needed. They ship as \`.zip\`:"
              echo "  Apple's notary service does not accept a tarball, and a tarball"
              echo "  cannot carry the notarization ticket."
            else
              echo "- **The macOS archives are not notarized.** This build had no signing"
              echo "  certificate, so they carry an ad-hoc signature only. After"
              echo "  downloading, run \`xattr -rc rodin.app\`. They still ship as"
              echo "  \`.zip\` so the format never depends on which secrets a"
              echo "  repository holds."
            fi
            echo "- Every product archive and the update site carry a build provenance"
            echo "  attestation. Verify one with"
            echo "  \`gh attestation verify --repo $GITHUB_REPOSITORY <file>\`."
            echo "- \`SHA256SUMS\` is attached; verify with \`sha256sum -c SHA256SUMS\`."
            echo
          } > RELEASE_NOTES.md

      - name: Append the generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Name the previous release rather than letting GitHub pick one: it
          # takes the latest prerelease too, so v3.10.0-2611 went out compared
          # against its own -rc1, a one-commit changelog.  The previous release
          # is the last real one below this tag in version order (candidates
          # compare from their final tag); a rebuilt old tag thus keeps its
          # own range.
          final=${TAG%%-rc*}
          previous=$(
            { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
                --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'
              printf '%s\n' "$final"
            } | sort -V -u | awk -v t="$final" '$0 == t { print prev } { prev = $0 }'
          )
          range=(-f tag_name="$TAG")
          if [ -n "$previous" ]; then
            echo "changelog since $previous"
            range+=(-f previous_tag_name="$previous")
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${range[@]}" --jq .body >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The tag regex admits -rcN.  A candidate is not what people should
          # land on, so keep it out of "Latest" rather than publishing it as
          # the current release.
          extra=()
          if [[ "$TAG" == *-rc* ]]; then
            extra=(--prerelease --latest=false)
          fi
          # This job deliberately does not check the repository out -- it only
          # needs the built artifacts -- so every gh call must name the repo.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            # --clobber only replaces an asset of the same name.  The macOS
            # archives changed format from .tar.gz to .zip, so a re-release of
            # a tag cut before that would otherwise keep serving the old
            # tarball beside the new zip -- and the tarball is the one
            # Gatekeeper rejects.  Drop anything the new set does not cover.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > published.txt
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              # SHA256SUMS is attached by a later job, so it is never in
              # assets/ and must not be taken for a leftover.
              [ -e "assets/$name" ] || [ "$name" = SHA256SUMS ] || {
                echo "Deleting stale asset $name"
                gh release delete-asset "$TAG" "$name" --yes \
                  --repo "$GITHUB_REPOSITORY"
              }
            done < published.txt
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
            # The notes carry a table of the feature versions this run built,
            # so refresh them with the assets.  Uploading alone would leave
            # text describing the build it just replaced.
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rodin Bundle $TAG" \
              --notes-file RELEASE_NOTES.md "${extra[@]}"
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rodin Bundle $TAG" \
              --notes-file RELEASE_NOTES.md "${extra[@]}"
          fi

      - name: Attest the published assets
        # After the upload, so the attested digests are the bytes the release
        # serves.  Together with notarization this covers both questions a user
        # can ask: Apple vouches that the app is safe to run, and this vouches
        # for which workflow run built it.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*

  checksums:
    name: SHA256SUMS
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach SHA256SUMS to the release
    steps:
      - name: Hash the published assets
        # Deliberately hashes what the release actually serves rather than what
        # the build produced, so a truncated or missing upload is caught here.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          workdir="$(mktemp -d)"
          cd "$workdir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'rodin-*.tar.gz' --pattern 'rodin-*.zip'
          archives=(rodin-*.tar.gz rodin-*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No release archives found for $TAG" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  pages:
    name: Publish the add-ons update site
    # After publish, so the site only ever advertises features that made it
    # into a release.  A user installing from the URL therefore gets the last
    # release rather than whatever rossi happens to be at -- and not a release
    # candidate, which is published as a prerelease precisely so that nobody
    # gets it without asking.
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: updates-site
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
