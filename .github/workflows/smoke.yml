name: Smoke

# Reusable per-platform smoke test.  Tycho materializes every platform's
# archive on Linux, so this is the only place the archives are exercised on
# the operating system they target.
on:
  workflow_call:

jobs:
  smoke:
    # Named by the archive rather than the runner: macos-latest is arm64 and
    # runs both Apple Silicon archives, the x86_64 one under Rosetta.
    name: Smoke test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux.gtk.x86_64
          - os: windows-latest
            platform: win32.win32.x86_64
          - os: macos-latest
            platform: macosx.cocoa.x86_64
          - os: macos-latest
            platform: macosx.cocoa.aarch64
    steps:
      # Only the product definition, which is what says who the roots are.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: bundle/Rodin.product
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Unpack the archive for this platform
        shell: bash
        run: |
          set -euo pipefail
          # One archive per platform triple, so the extension need not be
          # spelled out; the case below tells the two formats apart.
          archive=$(ls assets/*${{ matrix.platform }}.*)
          echo "Unpacking $archive"
          mkdir -p rodin
          case "$archive" in
            *.zip)    unzip -q "$archive" -d rodin ;;
            *.tar.gz) tar xzf "$archive" -C rodin ;;
          esac

      - name: Assert the bundle really contains our features
        # Runs the p2 director against the unpacked product and checks that the
        # roots we added are installed.  This catches a product that assembles
        # but cannot start, which a file listing would not.
        shell: bash
        run: |
          set -euo pipefail
          launcher=$(find rodin -name 'org.eclipse.equinox.launcher_*.jar' | head -1)
          test -n "$launcher" || { echo "no equinox launcher in the archive"; exit 1; }
          dest=$(dirname "$(dirname "$launcher")")
          java -jar "$launcher" -nosplash \
               -application org.eclipse.equinox.p2.director \
               -destination "$dest" -listInstalledRoots > roots.txt
          cat roots.txt
          # The roots are the product plus the features it marks
          # installMode="root", and p2 gives a feature the .feature.group
          # suffix.  Derived from the product rather than listed here, so a
          # root added there cannot ship untested: a hand-kept copy had
          # already missed org.rodinp.handbook.feature.
          {
            grep -oE 'uid="[^"]+"' bundle/Rodin.product | head -1 \
              | sed -E 's/uid="([^"]+)"/\1/'
            grep -oE 'id="[^"]+" installMode="root"' bundle/Rodin.product \
              | sed -E 's/id="([^"]+)".*/\1.feature.group/'
          } > expected.txt
          test -s expected.txt || { echo "no roots found in bundle/Rodin.product"; exit 1; }
          cat expected.txt
          while read -r iu; do
            grep -q "^$iu/" roots.txt || { echo "MISSING installed root: $iu"; exit 1; }
          done < expected.txt
          # The Rodin platform is pulled in by the product rather than being a
          # root of its own, so check it landed on disk instead.
          ls "$dest/features" | grep -q '^org\.rodinp\.platform_' \
            || { echo "MISSING feature: org.rodinp.platform"; exit 1; }
          echo "every product root and the Rodin platform are present"

      - name: Run the bundled ProB
        # The director only proves the feature was installed.  It cannot tell a
        # working binary from one built for the wrong architecture, so start the
        # ProB CLI the way the plug-in does and require it to answer.
        shell: bash
        run: |
          set -euo pipefail
          launcher=$(find rodin -name 'org.eclipse.equinox.launcher_*.jar' | head -1)
          test -n "$launcher" || { echo "no equinox launcher in the archive"; exit 1; }
          plugins=$(dirname "$launcher")

          # de.prob.core carries probcli for every platform at once.  The
          # subdirectory names are the ones CliStarter.getOsInfo resolves; both
          # macOS archives use the same universal binary under "macos".
          case "${{ matrix.platform }}" in
            linux.gtk.x86_64)     subdir=linux64   ; cli=probcli.sh  ;;
            win32.win32.x86_64)   subdir=windows64 ; cli=probcli.exe ;;
            macosx.cocoa.*)       subdir=macos     ; cli=probcli.sh  ;;
            *) echo "unknown platform ${{ matrix.platform }}"; exit 1 ;;
          esac

          # The feature asks for de.prob.core unpacked, so the binaries
          # normally sit on disk; fall back to the jar in case that changes.
          src=$(echo "$plugins"/de.prob.core_*)
          src=${src%% *}
          test -e "$src" || { echo "no de.prob.core in $plugins"; exit 1; }
          if [ -d "$src" ]; then
            prob="$src/prob/$subdir"
          else
            work=$(mktemp -d)
            unzip -qo "$src" -d "$work"
            prob="$work/prob/$subdir"
          fi
          test -d "$prob" || { echo "no probcli directory $prob"; exit 1; }
          # p2 does not preserve the executable bit; the plug-in sets it at
          # startup, so the smoke test has to do the same.
          chmod +x "$prob"/probcli* "$prob"/lib/send_user_interrupt* 2>/dev/null || true

          # file(1) is not part of Git for Windows, hence the guard.
          if command -v file > /dev/null; then
            file "$prob"/probcli*
            case "${{ matrix.platform }}" in
              linux.gtk.x86_64)
                file "$prob/probcli" | grep -q 'ELF 64-bit' \
                  || { echo "probcli is not a 64-bit ELF binary"; exit 1; } ;;
              macosx.cocoa.aarch64)
                # ProB ships one universal binary for both macOS archives.  Lose
                # the arm64 slice and Apple Silicon silently falls back to
                # Rosetta, which is exactly the failure the solvers had.
                file "$prob/probcli" | grep -q arm64 \
                  || { echo "probcli has no arm64 slice"; exit 1; } ;;
            esac
          fi

          # probcli finds its lib/ through PROB_HOME; without it the binary
          # falls back to the working directory and dies loading its
          # extensions.  CliStarter sets exactly this before launching.
          out=$(PROB_HOME="$prob" "$prob/$cli" -version 2>&1 | tr -d '\r')
          head -10 <<< "$out"
          grep -q 'ProB Command Line Interface' <<< "$out" \
            || { echo "MISSING version banner from probcli"; exit 1; }
          echo "the bundled ProB runs on ${{ matrix.platform }}"
